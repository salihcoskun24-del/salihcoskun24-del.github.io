name: Enable developer GitHub Pages
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/enable-pages.yml'
permissions:
  contents: read
  pages: write
jobs:
  enable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Enable branch-based Pages and request a build
        shell: bash
        run: |
          set -euo pipefail
          if ! gh api "repos/$GITHUB_REPOSITORY/pages" --silent; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/pages" \
              -f build_type=legacy -f 'source[branch]=main' -f 'source[path]=/' \
              --jq '{html_url,build_type,source}'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq '{status,url}'
